<title id="title">Ancoa: flujos lógicos críticos por etapa</title>
<desc id="desc">Ocho flujos propuestos con extremos y componentes de mediación. Cinco se habilitan en etapa 1 y tres se agregan en etapa 2. El trazo discontinuo indica protocolo de tercero por validar.</desc>
