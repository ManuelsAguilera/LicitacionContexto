<svg xmlns="http://www.w3.org/2000/svg" width="15.5cm" height="7.2cm" viewBox="0 0 620 288" role="img" aria-labelledby="title desc">
  <title id="title">Hitos de calidad en las etapas y la operación</title>
  <desc id="desc">Etapa 1: certificación M12, marcha blanca M13 a M15 y producción M16. Etapa 2 inicia M13, certifica M18, marcha blanca M19 a M20 y producción M21. Operación desde M21 hasta M56 con resiliencia y recuperación ante desastres semestral y seguridad anual.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #17324D; }
      .title { font-size: 17px; font-weight: 700; }
      .lane { font-size: 14px; font-weight: 700; }
      .month { font-size: 14px; font-weight: 700; }
      .event { font-size: 13px; }
      .ops { font-size: 13px; }
    </style>
  </defs>
  <rect width="620" height="288" fill="white"/>
  <text class="title" x="310" y="29" text-anchor="middle">Hitos de calidad en las etapas y la operación</text>

  <g class="month" text-anchor="middle">
    <text x="125" y="67">M12</text><text x="213" y="67">M13–15</text><text x="301" y="67">M16</text>
    <text x="389" y="67">M18</text><text x="477" y="67">M19–20</text><text x="565" y="67">M21</text>
  </g>
  <text class="lane" x="15" y="103">Etapa 1</text>
  <text class="lane" x="15" y="153">Etapa 2</text>

  <g stroke-width="1.4">
    <rect x="88" y="80" width="75" height="36" fill="#DCE8F2" stroke="#17324D"/>
    <rect x="163" y="80" width="100" height="36" fill="#E8F1F7" stroke="#17324D"/>
    <rect x="263" y="80" width="75" height="36" fill="#EDF3E8" stroke="#456B37"/>
    <rect x="163" y="126" width="100" height="44" fill="#F2F4F6" stroke="#7A8791"/>
    <rect x="338" y="126" width="100" height="44" fill="#DCE8F2" stroke="#17324D"/>
    <rect x="438" y="126" width="75" height="44" fill="#E8F1F7" stroke="#17324D"/>
    <rect x="513" y="126" width="94" height="44" fill="#EDF3E8" stroke="#456B37"/>
  </g>
  <g class="event" text-anchor="middle">
    <text x="125.5" y="103">Certificación</text>
    <text x="213" y="103">Marcha blanca</text>
    <text x="300.5" y="103" font-weight="700">Producción</text>
    <text x="213" y="153">Inicia</text>
    <text x="388" y="153">Certificación</text>
    <text x="475.5" y="145"><tspan x="475.5">Marcha</tspan><tspan x="475.5" dy="15">blanca</tspan></text>
    <text x="560" y="153" font-weight="700">Producción</text>
  </g>
  <text class="event" x="163" y="183" fill="#596874">Etapa 2 inicia en M13, durante la marcha blanca de Etapa 1</text>

  <rect x="15" y="204" width="592" height="64" rx="7" fill="#F3F5F6" stroke="#73818B" stroke-width="1.3"/>
  <text class="lane" x="29" y="229">Operación · Desde M21 hasta M56</text>
  <text class="ops" x="29" y="251">Pruebas semestrales de resiliencia y DR · Revisión anual de seguridad</text>
</svg>
