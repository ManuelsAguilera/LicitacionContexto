<svg xmlns="http://www.w3.org/2000/svg" width="15.5cm" height="6.2cm" viewBox="0 0 620 248" role="img" aria-labelledby="title desc">
  <title id="title">Puertas técnicas y aceptación del hito</title>
  <desc id="desc">Los cambios ordinarios pasan por cambio, integración continua, QA y preproducción antes de una liberación técnica. Al autorizar el paso de etapa, la Contraparte Técnica acepta el hito mediante acta, que habilita la producción de la etapa. Si falla un control, se corrige y se repiten las pruebas afectadas.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#17324D"/></marker>
    <marker id="redArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A33A32"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #17324D; }
      .title { font-size: 17px; font-weight: 700; }
      .step { font-size: 14px; font-weight: 700; }
      .role { font-size: 12px; }
      .note { font-size: 12px; }
    </style>
  </defs>
  <rect width="620" height="248" fill="white"/>
  <text class="title" x="310" y="29" text-anchor="middle">Puertas técnicas y aceptación del hito</text>

  <g fill="#E8F1F7" stroke="#17324D" stroke-width="1.5">
    <rect x="16" y="58" width="92" height="54" rx="10"/>
    <rect x="126" y="58" width="68" height="54" rx="10"/>
    <rect x="212" y="58" width="68" height="54" rx="10"/>
    <rect x="298" y="58" width="88" height="54" rx="10"/>
  </g>
  <rect x="468" y="58" width="136" height="54" rx="10" fill="#EDF3E8" stroke="#456B37" stroke-width="1.5"/>
  <g class="step" text-anchor="middle">
    <text x="62" y="81">Cambio</text><text class="role" x="62" y="100">Equipo</text>
    <text x="160" y="90">CI</text>
    <text x="246" y="90">QA</text>
    <text x="342" y="90">Preprod</text>
    <text x="536" y="90">Producción</text>
  </g>
  <g stroke="#17324D" stroke-width="1.7" fill="none" marker-end="url(#arrow)">
    <path d="M108 85 H123"/><path d="M194 85 H209"/><path d="M280 85 H295"/><path d="M386 85 H465"/>
  </g>

  <text class="note" x="374" y="140" text-anchor="middle" fill="#456B37">Solo al pasar de etapa</text>
  <rect x="250" y="149" width="250" height="42" rx="9" fill="#DCE8F2" stroke="#17324D" stroke-width="1.6"/>
  <text class="step" x="375" y="175" text-anchor="middle">Contraparte firma acta del hito</text>
  <path d="M386 112 V145" fill="none" stroke="#17324D" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M500 170 H536 V115" fill="none" stroke="#17324D" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text class="note" x="310" y="239" text-anchor="middle" fill="#762922">Si falla un control: corregir y repetir la prueba afectada antes de liberar</text>
</svg>
